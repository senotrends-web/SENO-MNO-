<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SENO &amp; MNO — Endless Runner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-root">

  <!-- ============ GAME CANVAS ============ -->
  <canvas id="game-canvas"></canvas>

  <!-- ============ INTRO VIDEO LAYER ============ -->
  <div id="intro-layer">
    <video id="intro-video" playsinline muted></video>
    <div id="intro-fallback">
      <div class="fallback-title">SENO <span>&amp;</span> MNO</div>
      <div class="fallback-sub">A night in old Cairo turns into a run for their lives.</div>
    </div>
    <button id="skip-intro-btn">SKIP INTRO ▶</button>
  </div>

  <!-- ============ READY / TAP TO START OVERLAY (after intro) ============ -->
  <div id="ready-layer" class="hidden">
    <div class="ready-hint">
      <div class="ready-title">TAP ANYWHERE TO RUN</div>
      <div class="ready-sub">The shadow behind them is getting closer...</div>
    </div>
  </div>

  <!-- ============ START SCREEN ============ -->
  <div id="start-screen" class="screen hidden">
    <div class="title-wrap">
      <div class="game-title">SENO <span>&amp;</span> MNO</div>
      <div class="game-subtitle">Escape Through Old Cairo</div>
    </div>
    <div class="start-characters">
      <div class="char-portrait seno"></div>
      <div class="char-portrait mno"></div>
    </div>
    <button id="start-btn" class="primary-btn">START</button>
    <div class="best-score-line">BEST: <span id="start-best-score">0</span></div>
  </div>

  <!-- ============ HUD ============ -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-box hud-score">
        <span class="hud-label">SCORE</span>
        <span id="hud-score-value">0</span>
      </div>
      <div class="hud-box hud-distance">
        <span class="hud-label">DISTANCE</span>
        <span id="hud-distance-value">0m</span>
      </div>
      <div class="hud-box hud-coins">
        <span class="hud-label">COINS</span>
        <span id="hud-coins-value">0</span>
      </div>
    </div>
    <button id="pause-btn">❚❚</button>
    <div id="powerup-indicator" class="hidden">
      <div id="powerup-bar-fill"></div>
    </div>
  </div>

  <!-- ============ PAUSE MENU ============ -->
  <div id="pause-menu" class="screen hidden">
    <div class="panel-title">PAUSED</div>
    <button id="resume-btn" class="primary-btn">RESUME</button>
    <button id="pause-restart-btn" class="secondary-btn">RESTART</button>
    <button id="pause-menu-btn" class="secondary-btn">MENU</button>
    <div class="volume-rows">
      <label>Master <input type="range" id="vol-master" min="0" max="1" step="0.05" value="0.8"></label>
      <label>SFX <input type="range" id="vol-sfx" min="0" max="1" step="0.05" value="0.9"></label>
      <label>Music <input type="range" id="vol-music" min="0" max="1" step="0.05" value="0.6"></label>
    </div>
  </div>

  <!-- ============ GAME OVER SCREEN ============ -->
  <div id="game-over-screen" class="screen hidden">
    <div class="panel-title over-title">GAME OVER</div>
    <div class="stats-block">
      <div class="stat-row"><span>SCORE</span><span id="over-score">0</span></div>
      <div class="stat-row"><span>DISTANCE</span><span id="over-distance">0m</span></div>
      <div class="stat-row"><span>COINS</span><span id="over-coins">0</span></div>
      <div class="stat-row best"><span>BEST SCORE</span><span id="over-best">0</span></div>
    </div>
    <button id="retry-btn" class="primary-btn">RETRY</button>
    <button id="over-menu-btn" class="secondary-btn">MENU</button>
  </div>

  <!-- ============ CINEMATIC CAPTION LAYER ============ -->
  <div id="cinematic-caption" class="hidden"></div>

</div>

<script src="game.js"></script>
</body>
</html>
